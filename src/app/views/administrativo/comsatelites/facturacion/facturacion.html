<app-page-header
  title="Facturación"
  subtitle="Operaciones completadas pendientes de facturar."
/>

<app-panel title="Operaciones por facturar">
  <span panelActions class="pill">{{ pendientes().length }} pendientes</span>
  <app-data-table [columns]="columns" [rows]="rows()" />
  <div class="actions">
    @for (row of rows(); track $index) {
      @if (esPendiente(row)) {
        <button
          type="button"
          class="btn btn-primary"
          (click)="facturar(row)"
        >
          Facturar {{ row['opId'] }}
        </button>
      }
    }
  </div>
</app-panel>
